# Revisa cada cambio antes de que llegue a producción: lint, pruebas, compilación y auditoría de dependencias.
# No despliega nada: los despliegues se hacen a mano.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cf-worker/package-lock.json
            cf-worker-tomodat/package-lock.json
      - run: npm ci
      # Las pruebas de los Workers cargan su código y `jose` desde la carpeta de cada Worker: sin esto no encuentran la librería.
      # `--omit=dev` salta Wrangler (pesado y no hace falta para probar).
      - name: Dependencias de los Workers
        run: |
          npm ci --omit=dev --prefix cf-worker
          npm ci --omit=dev --prefix cf-worker-tomodat
      - name: Lint
        run: npm run lint
      # Las pruebas que necesitan el emulador de Firestore (reglas, correlativo, respaldo...) quedan fuera: se corren en local con `npm test`.
      - name: Pruebas
        run: npm test -- --sin-emulador
      - name: Compilación
        run: npm run build
      # Falla con vulnerabilidades altas o críticas de producción, en la app y en cada Worker. Los avisos de herramientas de desarrollo
      # (`--omit=dev`) no cuentan: no llegan a producción. El aviso de @grpc/grpc-js dentro de firebase se cerró con el override de package.json.
      - name: Auditoría de producción
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix cf-worker
          npm audit --omit=dev --audit-level=high --prefix cf-worker-tomodat
